<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3730a3" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background base rounded -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner subtle border glow -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="#a5b4fc" stroke-width="6" stroke-opacity="0.3" />

  <!-- Main Box Icon & Barcode Graphic (Centered in Safe Area 80%) -->
  <g filter="url(#shadow)" transform="translate(64, 56)">
    <!-- Lower Box -->
    <path d="M60 210 L192 140 L324 210 L192 280 Z" fill="url(#boxGrad1)" />
    <path d="M60 210 L192 280 L192 370 L60 300 Z" fill="#4338ca" />
    <path d="M192 280 L324 210 L324 300 L192 370 Z" fill="#312e81" />

    <!-- Upper Box -->
    <path d="M112 110 L192 68 L272 110 L192 152 Z" fill="url(#boxGrad2)" />
    <path d="M112 110 L192 152 L192 210 L112 168 Z" fill="#0284c7" />
    <path d="M192 152 L272 110 L272 168 L192 210 Z" fill="#0369a1" />

    <!-- Barcode scan laser line across -->
    <line x1="50" y1="210" x2="334" y2="210" stroke="#f43f5e" stroke-width="6" stroke-linecap="round" stroke-dasharray="16 8" />
    
    <!-- Mini Stock Sparkle / Check -->
    <circle cx="290" cy="90" r="32" fill="url(#goldGrad)" />
    <path d="M276 90 L286 100 L304 82" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
